name: Deploy SDK Release

on:
  repository_dispatch:
    types: [deploy_release]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Extract Payload
        id: payload
        run: |
          {
            echo "VERSION=${{ github.event.client_payload.version }}"
            echo "CHECKSUM=${{ github.event.client_payload.checksum }}"
            echo "FRAMEWORK_NAME=${{ github.event.client_payload.framework_name }}"
            echo "TAG=${{ github.event.client_payload.tag }}"
            echo "INTERNAL_RELEASE_URL=${{ github.event.client_payload.internal_release_url }}"
          } >> "$GITHUB_ENV"
          
          echo "Received deployment request:"
          echo "  Version: ${{ github.event.client_payload.version }}"
          echo "  Tag: ${{ github.event.client_payload.tag }}"
          echo "  Checksum: ${{ github.event.client_payload.checksum }}"
          echo "  Framework: ${{ github.event.client_payload.framework_name }}"

      - name: Set Workflow Variables
        run: |
          VERSION_SHORT="${TAG%.*}"
          RELEASE_BRANCH="release/$VERSION_SHORT"
          INTERNAL_REPO="graupel/ios-quadrascan-sdk-internal"
          PUBLIC_REPO="graupel/ios-quadrascan-sdk"
          
          {
            echo "RELEASE_BRANCH=$RELEASE_BRANCH"
            echo "INTERNAL_REPO=$INTERNAL_REPO"
            echo "PUBLIC_REPO=$PUBLIC_REPO"
          } >> "$GITHUB_ENV"
          
          echo "Release branch: $RELEASE_BRANCH"
          echo "Internal repo: $INTERNAL_REPO"
          echo "Public repo: $PUBLIC_REPO"

      - name: Check if Release Already Exists
        id: check_release
        run: |
          if gh release view "$TAG" --repo "$PUBLIC_REPO" &>/dev/null; then
            echo "Release $TAG already exists on public repo. Exiting."
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout Repository
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Metadata from Internal Release
        if: steps.check_release.outputs.exists == 'false'
        run: |
          echo "Downloading release_metadata.json from internal release..."
          
          gh release download "$TAG" \
            --repo "$INTERNAL_REPO" \
            --pattern "release_metadata.json"
          
          echo "✓ Downloaded release_metadata.json"
        env:
          GH_TOKEN: ${{ secrets.INTERNAL_REPO_TOKEN }}

      - name: Download XCFrameworks from Internal Release
        if: steps.check_release.outputs.exists == 'false'
        run: |
          # From 1.0.0 the metadata lists the core and UI frameworks. Earlier releases
          # carry one framework, named in the dispatch payload.
          if jq -e '.frameworks[0].module' release_metadata.json > /dev/null; then
            ARCHIVES=$(jq -r '[.frameworks[].name] | join(" ")' release_metadata.json)
          else
            ARCHIVES="$FRAMEWORK_NAME"
          fi
          echo "FRAMEWORK_NAMES=$ARCHIVES" >> "$GITHUB_ENV"
          
          for NAME in $ARCHIVES; do
            echo "Downloading $NAME.zip from internal release..."
          
            gh release download "$TAG" \
              --repo "$INTERNAL_REPO" \
              --pattern "$NAME.zip"

            if [ ! -f "$NAME.zip" ]; then
              echo "Error: Failed to download $NAME.zip"
              exit 1
            fi

            echo "✓ Downloaded $NAME.zip"
            ls -lh "$NAME.zip"
          done
        env:
          GH_TOKEN: ${{ secrets.INTERNAL_REPO_TOKEN }}

      - name: Checkout or Create Release Branch
        if: steps.check_release.outputs.exists == 'false'
        run: |
          echo "Working with release branch: $RELEASE_BRANCH"
          
          # Fetch all remote branches
          git fetch origin
          
          if git ls-remote --heads origin "$RELEASE_BRANCH" | grep -q "$RELEASE_BRANCH"; then
            echo "Release branch $RELEASE_BRANCH exists - checking it out to build on existing commits"
            git checkout -b "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"
            git log --oneline -3
          else
            echo "Creating new release branch: $RELEASE_BRANCH from current HEAD"
            git checkout -b "$RELEASE_BRANCH"
            git push -u origin "$RELEASE_BRANCH"
          fi
          
          echo "✓ Ready to commit on: $RELEASE_BRANCH"

      - name: Update Package.swift
        if: steps.check_release.outputs.exists == 'false'
        run: |
          echo "Updating Package.swift for $TAG..."

          RELEASE_URL="https://github.com/$PUBLIC_REPO/releases/download/$TAG"

          if jq -e '.frameworks[0].module' release_metadata.json > /dev/null; then
            CORE_NAME=$(jq -r '.frameworks[] | select(.module == "Quadrascan") | .name' release_metadata.json)
            CORE_CHECKSUM=$(jq -r '.frameworks[] | select(.module == "Quadrascan") | .compressed_framework_hash' release_metadata.json)
            UI_NAME=$(jq -r '.frameworks[] | select(.module == "QuadrascanUI") | .name' release_metadata.json)
            UI_CHECKSUM=$(jq -r '.frameworks[] | select(.module == "QuadrascanUI") | .compressed_framework_hash' release_metadata.json)
          
            if [ -z "$CORE_NAME" ] || [ -z "$CORE_CHECKSUM" ] || [ -z "$UI_NAME" ] || [ -z "$UI_CHECKSUM" ]; then
              echo "Error: release_metadata.json must list the Quadrascan and QuadrascanUI frameworks with checksums"
              exit 1
            fi
          
            # A binary target cannot declare dependencies, so the UI product lists both targets.
            cat > Package.swift <<'EOF'
          // swift-tools-version: 6.2
          // The swift-tools-version declares the minimum version of Swift required to build this package.

          import PackageDescription

          let package = Package(
              name: "Quadrascan",
              platforms: [.iOS(.v17)],
              products: [
                  .library(
                      name: "Quadrascan",
                      targets: ["Quadrascan"]
                  ),
                  .library(
                      name: "QuadrascanUI",
                      targets: ["QuadrascanUI", "Quadrascan"]
                  )
              ],
              targets: [
                  .binaryTarget(
                      name: "Quadrascan",
                      url: "CORE_URL_PLACEHOLDER",
                      checksum: "CORE_CHECKSUM_PLACEHOLDER"
                  ),
                  .binaryTarget(
                      name: "QuadrascanUI",
                      url: "UI_URL_PLACEHOLDER",
                      checksum: "UI_CHECKSUM_PLACEHOLDER"
                  )
              ]
          )
          EOF

            sed -i "s|CORE_URL_PLACEHOLDER|$RELEASE_URL/$CORE_NAME.zip|g" Package.swift
            sed -i "s|CORE_CHECKSUM_PLACEHOLDER|$CORE_CHECKSUM|g" Package.swift
            sed -i "s|UI_URL_PLACEHOLDER|$RELEASE_URL/$UI_NAME.zip|g" Package.swift
            sed -i "s|UI_CHECKSUM_PLACEHOLDER|$UI_CHECKSUM|g" Package.swift
          else
            cat > Package.swift <<'EOF'
          // swift-tools-version: 6.2
          // The swift-tools-version declares the minimum version of Swift required to build this package.
          
          import PackageDescription
          
          let package = Package(
              name: "Quadrascan",
              platforms: [.iOS(.v17)],
              products: [
                  .library(
                      name: "Quadrascan",
                      targets: ["Quadrascan"]
                  )
              ],
              targets: [
                  .binaryTarget(
                      name: "Quadrascan",
                      url: "URL_PLACEHOLDER",
                      checksum: "CHECKSUM_PLACEHOLDER"
                  )
              ]
          )
          EOF
          
            sed -i "s|URL_PLACEHOLDER|$RELEASE_URL/$FRAMEWORK_NAME.zip|g" Package.swift
            sed -i "s|CHECKSUM_PLACEHOLDER|$CHECKSUM|g" Package.swift
          fi
          
          echo "✓ Package.swift updated"
          cat Package.swift

      - name: Commit and Push Package.swift
        if: steps.check_release.outputs.exists == 'false'
        run: |
          git config user.name "fm-automatiton-user"
          git config user.email "automation@fitmatch.ai"
          
          git add Package.swift
          git commit -m "Update Package.swift for $TAG binary distribution"
          git push origin "$RELEASE_BRANCH"
          
          echo "✓ Package.swift committed and pushed"
          echo "Commit hash: $(git rev-parse HEAD)"

      - name: Create Public GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        run: |
          echo "Creating release $TAG on public repo..."
          
          FRAMEWORK_ZIPS=()
          for NAME in $FRAMEWORK_NAMES; do
            FRAMEWORK_ZIPS+=("$NAME.zip")
          done

          gh release create "$TAG" \
            --repo "$PUBLIC_REPO" \
            --title "$TAG" \
            --notes "" \
            --target "$RELEASE_BRANCH" \
            "${FRAMEWORK_ZIPS[@]}" \
            release_metadata.json
          
          echo "✓ Public release created successfully"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        if: steps.check_release.outputs.exists == 'false'
        run: |
          {
            echo "## Deployment Summary"
            echo ""
            echo "- **Version:** $VERSION"
            echo "- **Tag:** $TAG"
            echo "- **Frameworks:** $FRAMEWORK_NAMES"
            echo "- **Release Branch:** $RELEASE_BRANCH"
            echo "- **Commit:** $(git rev-parse HEAD)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

